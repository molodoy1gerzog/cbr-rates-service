services:
  app:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      CBR_URL: "https://www.cbr-xml-daily.ru/daily_json.js"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
